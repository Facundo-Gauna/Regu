<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<title>Regu · pruebas e2e</title>
<style>
  body { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 8px; display: grid; grid-template-columns: 412px 1fr; gap: 14px; background: #fff; color: #111; }
  iframe { width: 400px; height: 860px; border: 2px solid #888; background: #fff; }
  h3 { margin: 0 0 8px; }
  #log div { padding: 1px 0; }
  .ok { color: #137333; }
  .mal { color: #c5221f; font-weight: 700; }
  .mal small { display: block; font-weight: 400; color: #7a1d1a; }
</style>
<iframe id="app" title="Regu"></iframe>
<main>
  <h3 id="titulo">Ejecutando pruebas…</h3>
  <div id="log"></div>
</main>
<!-- Retiene el evento load hasta que el servidor recibe los resultados (ver herramientas/e2e.mjs) -->
<img src="/__espera.gif" width="1" height="1" alt="" style="position: fixed; left: -9px; top: 0" />

<script type="module">
  // Dónde está la app (la fija el runner); termina siempre en /
  const BASE = new URLSearchParams(location.search).get('base') ?? '/';
  const marco = document.getElementById('app');
  const registro = document.getElementById('log');
  const resultados = [];
  const erroresApp = [];

  const pausa = ms => new Promise(r => setTimeout(r, ms));
  const doc = () => marco.contentDocument;
  const ventana = () => marco.contentWindow;
  const texto = el => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
  const afirmar = (cond, mensaje) => { if (!cond) throw new Error(mensaje); };

  /** Reintenta hasta que la condición devuelva algo verdadero (acepta funciones asíncronas). */
  async function esperar(cond, descripcion, ms = 6000) {
    const t0 = performance.now();
    let ultimo;
    while (performance.now() - t0 < ms) {
      try { const r = await cond(); if (r) return r; } catch (e) { ultimo = e; }
      await pausa(40);
    }
    throw new Error(`Tiempo agotado esperando: ${descripcion}${ultimo ? ` (${ultimo.message})` : ''}`);
  }

  function engancharErrores() {
    const w = ventana();
    w.addEventListener('error', e => erroresApp.push(`error: ${e.message}`));
    w.addEventListener('unhandledrejection', e => erroresApp.push(`promesa rechazada: ${e.reason?.message ?? e.reason}`));
  }
  /** La carga del iframe tiene tiempo límite: una página que no termina de cargar es un fallo, no un cuelgue. */
  const navegar = (iniciar, descripcion) => new Promise((resolver, rechazar) => {
    const t = setTimeout(() => rechazar(new Error(`La página no terminó de cargar (${descripcion})`)), 12000);
    marco.onload = () => { clearTimeout(t); engancharErrores(); resolver(); };
    iniciar();
  });
  const cargar = async url => {
    // Si solo cambia el #, el navegador no recarga y no hay evento load: se pasa por una página en blanco para forzar una carga real.
    await navegar(() => { marco.src = 'about:blank'; }, 'página en blanco');
    await navegar(() => { marco.src = url; }, url);
  };
  const recargar = () => navegar(() => ventana().location.reload(), 'recarga');
  const irA = hash => { ventana().location.hash = hash; };

  // ---- Ayudas de DOM ----
  const todos = (sel, raiz = doc()) => [...raiz.querySelectorAll(sel)];
  const hallar = (sel, t, raiz) => todos(sel, raiz).find(e => texto(e).includes(t));
  const hallarExacto = (sel, t, raiz) => todos(sel, raiz).find(e => texto(e) === t);
  const seccion = titulo => todos('section.seccion').find(s => texto(s.querySelector('.seccion__titulo')) === titulo);
  const hoja = () => doc().querySelector('dialog[open]');
  // Como una persona: después de cada acción se le da tiempo a la interfaz para actualizarse (Preact renderiza en diferido).
  const PAUSA_UI = 60;
  const clic = async (el, descripcion = 'el elemento') => { afirmar(el, `No se encontró ${descripcion}`); el.click(); await pausa(PAUSA_UI); };
  async function escribir(el, valor, descripcion = 'el campo') {
    afirmar(el, `No se encontró ${descripcion}`);
    const W = ventana();
    const proto = el instanceof W.HTMLSelectElement ? W.HTMLSelectElement.prototype : W.HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, valor);
    el.dispatchEvent(new W.Event('input', { bubbles: true }));
    el.dispatchEvent(new W.Event('change', { bubbles: true }));
    await pausa(PAUSA_UI);
  }
  /** Estado de la hoja abierta, para entender por qué no se cierra: mensaje de error y campos inválidos. */
  function diagnosticoHoja() {
    const h = hoja();
    if (!h) return 'la hoja ya está cerrada';
    const invalidos = todos('input, select', h).filter(e => !e.checkValidity()).map(e => `${e.type}[valor="${e.value}", ${e.validationMessage}]`);
    const error = texto(h.querySelector('.aviso--error'));
    return `error en pantalla: «${error}»; campos inválidos: ${invalidos.join(' ; ') || 'ninguno'}`;
  }
  async function esperarHojaCerrada() {
    try { await esperar(() => !hoja(), 'que se cierre la hoja'); }
    catch (e) { throw new Error(`${e.message} — ${diagnosticoHoja()}`); }
  }
  const cifra = indice => texto(todos('.portada__cifras strong')[indice]);
  async function enviarBackup(json, nombre = 'backup.json') {
    const W = ventana();
    const entrada = await esperar(() => doc().querySelector('input[type=file]'), 'el campo de archivo');
    const dt = new W.DataTransfer();
    dt.items.add(new W.File([JSON.stringify(json)], nombre, { type: 'application/json' }));
    entrada.files = dt.files;
    entrada.dispatchEvent(new W.Event('change', { bubbles: true }));
  }
  const backup = (datos, version = 1) => ({ app: 'regu', schemaVersion: version, exportado: new Date().toISOString(), datos });
  const perfil = { planId: 'utn-frvm-isi-2023', calendarioId: 'utn-frvm-2026-27', anioIngreso: 2026 };

  // ---- Registro ----
  function pintar(final = false) {
    registro.replaceChildren(...resultados.map(r => {
      const d = document.createElement('div');
      d.className = r.ok ? 'ok' : 'mal';
      d.textContent = `${r.ok ? '✓' : '✗'} ${r.nombre}`;
      if (!r.ok) { const s = document.createElement('small'); s.textContent = r.error; d.append(s); }
      return d;
    }));
    const mal = resultados.filter(r => !r.ok).length;
    document.getElementById('titulo').textContent = final
      ? (mal ? `${mal} de ${resultados.length} pruebas FALLARON` : `Las ${resultados.length} pruebas pasaron`)
      : `Ejecutando… (${resultados.length})`;
  }
  async function prueba(nombre, fn) {
    try { await fn(); resultados.push({ nombre, ok: true }); }
    catch (e) { resultados.push({ nombre, ok: false, error: e.message }); }
    pintar();
    // Avance parcial: si algo corta la ejecución, el runner igual muestra lo que se llegó a hacer
    fetch('/__parcial', { method: 'POST', body: JSON.stringify({ resultados, siguiente: nombre }) }).catch(() => {});
  }

  // =====================================================================================================
  // Empiezo desde cero: base de datos y service workers limpios
  await new Promise(ok => { const r = indexedDB.deleteDatabase('regu'); r.onsuccess = ok; r.onerror = ok; r.onblocked = ok; });
  await cargar(BASE);

  await prueba('Primer uso: aparece la bienvenida, con el aviso de que no es una app oficial', async () => {
    await esperar(() => hallar('button', 'Empezar'), 'el botón Empezar');
    afirmar(hallar('.bienvenida__legal', 'No es una aplicación oficial'), 'falta el aviso legal');
    afirmar(hallar('.bienvenida', 'Probar con datos de ejemplo'), 'falta el modo ejemplo');
  });

  await prueba('Empezar lleva al plan con las 36 materias obligatorias', async () => {
    await escribir(doc().querySelector('input[type=number]'), '2026', 'el año de ingreso');
    await clic(hallar('button', 'Empezar'));
    await esperar(() => ventana().location.hash === '#/plan', 'ir al plan');
    await esperar(() => todos('.chip-materia').length === 36, '36 materias en el plan');
    afirmar(hallar('.aviso', 'Marcá lo que ya hiciste'), 'falta la ayuda del primer uso');
  });

  await prueba('Fecha simulada: se fija en 23/11/2026 y se avisa en TODAS las pantallas', async () => {
    // Fija "hoy" para que las pruebas no dependan del reloj de la máquina (los ciclos y las inscripciones dependen de la fecha)
    irA('#/ajustes');
    await escribir(await esperar(() => doc().querySelector('input[type=date]'), 'el campo de fecha simulada'), '2026-11-23');
    for (const ruta of ['#/ajustes', '#/', '#/materias', '#/plan', '#/finales', '#/calendario', '#/progreso', '#/materia/fisica-1']) {
      irA(ruta);
      await esperar(() => hallar('.franja-fecha', 'Fecha simulada: 23/11/2026'), `el aviso de fecha simulada en ${ruta}`);
      afirmar(hallar('.cabecera__modo--fecha', 'Fecha simulada'), `falta la marca en la cabecera en ${ruta}`);
    }
    irA('#/plan');
    await esperar(() => todos('.chip-materia').length === 36, 'volver al plan');
  });

  await prueba('Marcar Análisis Matemático I como aprobada (final, nota 8)', async () => {
    const chip = hallarExacto('.chip-materia__nombre', 'Análisis Matemático I').closest('button');
    await clic(chip, 'la materia');
    await clic(await esperar(() => hallar('aside button', 'Editar estado'), 'el panel de la materia'));
    await esperar(hoja, 'la hoja de edición');
    await clic(hallar('dialog[open] .acciones-rapidas button', 'Aprobada'), 'el botón Aprobada');
    await escribir(await esperar(() => hoja().querySelector('input[type=number]'), 'el campo de nota'), '8');
    await clic(hallar('dialog[open] button[type=submit]', 'Marcar como aprobada'));
    await esperarHojaCerrada();
    const chipNuevo = hallarExacto('.chip-materia__nombre', 'Análisis Matemático I').closest('button');
    afirmar(texto(chipNuevo).includes('Aprobada · 8'), `el chip dice: ${texto(chipNuevo)}`);
  });

  await prueba('Persistencia: al recargar sigue aprobada y Inicio cuenta 1 aprobada', async () => {
    await recargar();
    const chip = await esperar(() => hallarExacto('.chip-materia__nombre', 'Análisis Matemático I')?.closest('button'), 'el plan tras recargar');
    afirmar(texto(chip).includes('Aprobada · 8'), `tras recargar dice: ${texto(chip)}`);
    irA('#/');
    await esperar(() => cifra(0) === '1', 'la cifra de aprobadas');
  });

  await prueba('Mapa del plan: elegir una materia dibuja un camino por cada materia relacionada, y quitar la selección los borra', async () => {
    irA('#/plan?sel=analisis-matematico-2'); // el enlace deja la materia seleccionada
    await esperar(() => doc().querySelector('.chip-materia[aria-pressed=true]'), 'la materia seleccionada por el enlace');
    const relacionadas = () => todos('.chip-materia--requisito, .chip-materia--desbloquea').length;
    await esperar(() => relacionadas() >= 3, 'las materias relacionadas resaltadas');
    await esperar(() => todos('.mapa__conectores .conector').length === relacionadas(), `un camino por cada materia relacionada (${relacionadas()})`);
    const solidos = todos('.mapa__conectores .conector:not(.conector--desbloquea)').length;
    afirmar(solidos === todos('.chip-materia--requisito').length, `caminos sólidos ${solidos} ≠ materias que necesita`);
    afirmar(hallar('.panel-seleccion', 'Análisis Matemático II'), 'falta el panel de la materia');
    // dos materias de 1.er año son correlativas de Análisis Matemático II
    afirmar(hallar('.chip-materia--requisito', 'Álgebra y Geometría Analítica'), 'Álgebra debería figurar como necesaria');
    await clic(doc().querySelector('.panel-seleccion button[aria-label="Cerrar selección"]'));
    await esperar(() => todos('.mapa__conectores .conector').length === 0, 'que se borren los caminos');
  });

  await prueba('PWA: el service worker se instala y precachea la app', async () => {
    const w = ventana();
    await esperar(async () => (await w.navigator.serviceWorker.getRegistration())?.active, 'service worker activo', 15000);
    const claves = await esperar(async () => { const k = await w.caches.keys(); return k.length ? k : null; }, 'caché de precarga');
    const n = (await (await w.caches.open(claves[0])).keys()).length;
    afirmar(n >= 10, `la precarga tiene solo ${n} entradas`);
  });

  await prueba('Sin conexión: la app abre desde el caché, sin tocar el servidor, y conserva los datos', async () => {
    await recargar(); // desde acá la página está controlada por el service worker
    afirmar(ventana().navigator.serviceWorker.controller, 'la página no está controlada por el service worker');
    await fetch('/__sinred?on=1');
    try {
      await recargar();
      await esperar(() => doc().querySelector('.cabecera'), 'que la app abra sin conexión', 10000);
      irA('#/plan');
      const chip = await esperar(() => hallarExacto('.chip-materia__nombre', 'Análisis Matemático I')?.closest('button'), 'el plan sin conexión');
      afirmar(texto(chip).includes('Aprobada · 8'), 'sin conexión se perdieron los datos');
      const pedidos = await (await fetch('/__pedidos')).json();
      afirmar(pedidos.length === 0, `llegaron ${pedidos.length} pedidos al servidor sin conexión: ${pedidos.join(', ')}`);
    } finally {
      await fetch('/__sinred?on=0');
    }
  });

  await prueba('Cursada de Álgebra: regular en el 1.er cuatrimestre 2026, con cierre tomado del calendario', async () => {
    irA('#/materia/algebra-geometria-analitica');
    await esperar(() => texto(doc().querySelector('h1')) === 'Álgebra y Geometría Analítica', 'la materia');
    await clic(seccion('Cursadas').querySelector('button'), 'Cargar cursada');
    await esperar(hoja, 'la hoja');
    await clic(hallar('dialog[open] button[type=submit]', 'Guardar cursada'));
    await esperarHojaCerrada();
    const t = texto(seccion('Cursadas'));
    afirmar(t.includes('1.er cuatrimestre 2026') && t.includes('Regular') && t.includes('cierre 03/07/2026'), `Cursadas dice: ${t}`);
    afirmar(texto(doc().querySelector('.encabezado-materia')).includes('Regular'), 'el estado no cambió a Regular');
  });

  await prueba('Un aplazo se cuenta: 1 de 4 aplazos', async () => {
    await clic(seccion('Finales').querySelector('button'), 'Cargar final');
    await esperar(hoja, 'la hoja');
    await clic(hallar('dialog[open] label.segmentado__opcion', 'Me aplazaron'));
    await escribir(await esperar(() => hoja().querySelector('input[type=number]'), 'el campo de nota'), '4');
    await clic(hallar('dialog[open] button[type=submit]', 'Guardar final'));
    await esperarHojaCerrada();
    afirmar(texto(seccion('Finales')).includes('Aplazo · 4'), `Finales dice: ${texto(seccion('Finales'))}`);
    const calculo = todos('details.plegable').find(d => texto(d.querySelector('summary')) === 'Cómo se calculó');
    afirmar(calculo && texto(calculo).includes('1 de 4 aplazos usados'), `Cómo se calculó: ${texto(calculo)}`);
    afirmar(texto(doc().querySelector('.camino__paso--actual')).includes('Final'), `Camino: el paso actual es «${texto(doc().querySelector('.camino__paso--actual'))}», debería ser el Final`);
  });

  await prueba('Notas de la cursada: se cargan, se promedian, un recuperatorio reemplaza, y sobreviven a recargar', async () => {
    const filas = () => todos('.nota');
    const resumen = () => texto(seccion('Cómo viene la cursada'));
    const cargarNota = async (nombre, nota, tipo, reemplazaNombre) => {
      await clic(seccion('Cómo viene la cursada').querySelector('button'), 'Cargar nota');
      await esperar(hoja, 'la hoja de la nota');
      await escribir(hoja().querySelector('input[type=text]'), nombre, 'el nombre');
      if (tipo) await clic(hallar('dialog[open] label.segmentado__opcion', tipo), tipo);
      await escribir(hoja().querySelector('input[type=number]'), String(nota), 'la nota');
      if (reemplazaNombre) {
        const sel = await esperar(() => hoja().querySelector('select'), 'la lista «¿Qué evaluación reemplaza?»');
        const opcion = [...sel.options].find(o => o.textContent.includes(reemplazaNombre));
        afirmar(opcion, `no hay una opción para ${reemplazaNombre}`);
        await escribir(sel, opcion.value, 'la lista de reemplazo');
      }
      await clic(hallar('dialog[open] button[type=submit]', 'Cargar nota'));
      await esperarHojaCerrada();
    };
    irA('#/materia/algebra-geometria-analitica');
    await esperar(() => texto(doc().querySelector('h1')) === 'Álgebra y Geometría Analítica', 'la materia');
    await esperar(() => seccion('Cómo viene la cursada'), 'la sección de notas');
    const referencias = () => texto(seccion('Cómo viene la cursada').querySelector('.referencias'));
    afirmar(referencias().includes('Regla general, sin confirmar'), `las referencias deberían figurar como sin confirmar: ${referencias()}`);
    await cargarNota('Parcial 1', 8);
    await cargarNota('Parcial 2', 6);
    await esperar(() => resumen().includes('Promedio 7 ') && resumen().includes('mínima 6 (Parcial 2)'), `promedio y mínima (${resumen().slice(0, 200)})`);
    afirmar(!/vas a promocionar|promocionás|regularizás/i.test(resumen()), 'el resumen no debería prometer un resultado');
    // el recuperatorio reemplaza a «Parcial 2»
    await cargarNota('Recuperatorio P2', 9, 'Recuperatorio', 'Parcial 2');
    await esperar(() => resumen().includes('Promedio 8,5'), `el promedio con el recuperatorio (${resumen().slice(0, 200)})`);
    afirmar(hallar('.nota--reemplazada', 'Parcial 2'), '«Parcial 2» debería figurar como reemplazada');
    // sobreviven a recargar
    await recargar();
    await esperar(() => seccion('Cómo viene la cursada') && filas().length === 3, 'las 3 notas tras recargar');
    afirmar(resumen().includes('Promedio 8,5'), `tras recargar: ${resumen().slice(0, 200)}`);
    // guardar sin tocar nada no las da por confirmadas
    await clic(hallar('.referencias button', 'Ajustar', seccion('Cómo viene la cursada')), 'Ajustar');
    await esperar(hoja, 'la hoja de referencias');
    await clic(hallar('dialog[open] button[type=submit]', 'Guardar referencias'));
    await esperar(() => hallar('dialog[open] .aviso--error', 'Elegí qué se pide'), 'sin elegir no se guarda nada');
    await clic(hoja().querySelector('button[aria-label=Cerrar]'));
    await esperarHojaCerrada();
    afirmar(texto(doc().querySelector('.referencias')).includes('sin confirmar'), `referencias: ${texto(doc().querySelector('.referencias'))}`);
    // referencias propias: ya no dicen «sin confirmar»
    await clic(hallar('.referencias button', 'Ajustar', seccion('Cómo viene la cursada')), 'Ajustar');
    await esperar(hoja, 'la hoja de referencias');
    for (const grupo of todos('dialog[open] .criterio__nivel')) await clic(hallar('label.segmentado__opcion', 'El promedio', grupo), 'El promedio');
    const [promo, regu] = todos('dialog[open] input[type=number]');
    await escribir(promo, '7'); await escribir(regu, '5');
    await clic(hallar('dialog[open] button[type=submit]', 'Guardar referencias'));
    await esperarHojaCerrada();
    const dd = () => todos('.referencias__valores dd').map(texto).join(' / ');
    afirmar(dd() === '7 / 5', `referencias: ${dd()}`);
    const bloque = texto(doc().querySelector('.referencias'));
    afirmar(bloque.includes('Las fijaste vos') && !bloque.includes('Regla general, sin confirmar'), `referencias: ${bloque}`);
    // borrar el recuperatorio: «Parcial 2» vuelve a contar
    // por el nombre exacto: la fila de «Parcial 2» también dice «reemplazada por Recuperatorio P2»
    const filaDe = nombre => filas().find(f => texto(f.querySelector('.nota__texto strong')) === nombre);
    await clic(filaDe('Recuperatorio P2').querySelector('button[aria-label^="Borrar"]'), 'Borrar');
    await clic(await esperar(() => filaDe('Recuperatorio P2')?.querySelector('button[aria-label^="Confirmar"]'), 'la confirmación'));
    await esperar(() => filas().length === 2 && resumen().includes('Promedio 7 '), `volver al promedio 7 (${resumen().slice(0, 160)})`);
    afirmar(!doc().querySelector('.nota--reemplazada'), '«Parcial 2» sigue reemplazada');
  });

  await prueba('Regla de la cátedra: Inglés I muestra la regla 2026, qué te falta según las notas, y no decide la asistencia', async () => {
    const regla = () => doc().querySelector('.regla');
    const cargarNota = async (nombre, nota) => {
      await clic(seccion('Cómo viene la cursada').querySelector('button'), 'Cargar nota');
      await esperar(hoja, 'la hoja de la nota');
      await escribir(hoja().querySelector('input[type=text]'), nombre, 'el nombre');
      await escribir(hoja().querySelector('input[type=number]'), String(nota), 'la nota');
      await clic(hallar('dialog[open] button[type=submit]', 'Cargar nota'));
      await esperarHojaCerrada();
    };
    irA('#/materia/ingles-1');
    await esperar(() => texto(doc().querySelector('h1')) === 'Inglés I', 'la materia');
    await clic(seccion('Cursadas').querySelector('button'), 'Cargar cursada');
    await esperar(hoja, 'la hoja');
    await clic(hallar('dialog[open] button[type=submit]', 'Guardar cursada'));
    await esperarHojaCerrada();
    await esperar(() => regla(), 'la regla de la cátedra');
    afirmar(texto(regla()).includes('planificación 2026'), `la regla: ${texto(regla()).slice(0, 200)}`);
    afirmar(texto(regla()).includes('Todavía no cargaste notas'), 'sin notas debería decir que todavía no cargó');
    await cargarNota('Instancia 1', 8);
    await cargarNota('Instancia 2', 7);
    await esperar(() => texto(regla()).includes('Instancia 2 (7)'), `el 7 debería marcar que no llega a 8 (${texto(regla()).slice(0, 300)})`);
    afirmar(texto(regla()).includes('Por tus notas, no alcanza'), 'para promocionar con un 7 debería decir que no alcanza');
    afirmar(texto(regla()).includes('Asistencia de 75 %'), 'la asistencia debe figurar como algo que depende del usuario');
    afirmar(texto(regla()).includes('Esto depende de vos'), 'falta el bloque «depende de vos»');
    afirmar(!/vas a promocionar|vas a regularizar/i.test(texto(regla())), 'no debería prometer un resultado');
    afirmar(texto(doc().querySelector('.referencias')).includes('De la planificación de tu cátedra'), 'las referencias deberían decir que salen de la planificación');
    // una materia con regla de texto no se calcula
    irA('#/materia/analisis-matematico-1');
    await esperar(() => texto(doc().querySelector('h1')) === 'Análisis Matemático I', 'otra materia');
    await clic(seccion('Cursadas').querySelector('button'), 'Cargar cursada');
    await esperar(hoja, 'la hoja');

    for (const g of grupos()) await clic(hallar('label.segmentado__opcion', 'El promedio', g), 'El promedio');

    await esperarHojaCerrada();
    await esperar(() => !texto(sec().querySelector('.veredicto-propio')).includes('no llega'), 'con promedio ya no se exige cada nota');

  await prueba('Carga rápida: fijar un acceso en Inicio y cargar una nota desde ahí', async () => {

  await prueba('La estructura y el acceso sobreviven a recargar con datos reales', async () => {
    await cargar(`${BASE}#/ajustes`);
    await escribir(await esperar(() => doc().querySelector('input[type=date]'), 'el campo de fecha simulada'), '2026-10-15');

    await clic(hallar('dialog[open] button[type=submit]', 'Guardar cursada'));

    await clic(await esperar(() => hallar('button', 'Organizar mis notas'), 'Organizar'));

    await clic(await esperar(() => hallar('dialog[open] button[type=submit]', 'Guardar estructura'), 'guardar'));

    irA('#/cargar?m=ingles-1');

  await prueba('Ayuda: el «?» muestra los pasos de la pantalla y al cerrar el foco vuelve al botón', async () => {
    await cargar(`${BASE}?ejemplo=1#/materia/fisica-2`);

  await prueba('Sin errores de JavaScript durante todos los flujos', async () => {
    afirmar(erroresApp.length === 0, erroresApp.join(' | '));

  pintar(true);
  // Sin esta señal el servidor no libera el evento load y Firefox no termina
  await fetch('/__resultado', { method: 'POST', body: JSON.stringify(resultados) });
</script>
